<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Youth cybersecurity education, accredited mentorship, and confidential child online protection (Act 1038) for Ghana." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0056D2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CyberGuard" />
    <meta name="application-name" content="CyberGuard Ghana" />
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <meta property="og:title" content="CyberGuard Ghana · National Cybersecurity Academy" />
    <meta property="og:description" content="Youth cybersecurity education, accredited mentorship, and confidential child online protection for Ghana." />
    <meta property="og:image" content="/pwa-512x512.png" />
    <script>
      (function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker
            .register("/sw.js", { scope: "/", updateViaCache: "none" })
            .then(function (reg) {
              reg.update();
            })
            .catch(function () {});
        }

        window.__deferredPwaPrompt = null;
        var autoPromptedThisSession = false;

        function triggerNativeInstallOnGesture() {
          if (autoPromptedThisSession || !window.__deferredPwaPrompt) return;
          autoPromptedThisSession = true;
          var promptEvent = window.__deferredPwaPrompt;
          try {
            promptEvent.prompt();
            promptEvent.userChoice.then(function (choice) {
              if (choice && choice.outcome === "accepted") {
                window.__deferredPwaPrompt = null;
                window.dispatchEvent(new CustomEvent("pwa-install-state-changed"));
              }
            });
          } catch (err) {}
        }

        window.addEventListener("beforeinstallprompt", function (e) {
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent("pwa-install-state-changed"));
          window.addEventListener("click", triggerNativeInstallOnGesture, { once: true, capture: true });
          window.addEventListener("touchend", triggerNativeInstallOnGesture, { once: true, capture: true });
        });

        window.addEventListener("appinstalled", function () {
          window.__deferredPwaPrompt = null;
          window.dispatchEvent(new CustomEvent("pwa-install-state-changed"));
        });
      })();
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
