<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="cgMarkShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="45%" stop-color="#0B3E9E" />
      <stop offset="100%" stop-color="#051736" />
    </linearGradient>

    <linearGradient id="cgMarkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="cgMarkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="cgMarkRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="cgMarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cgMarkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Soft Shadow & Shield Body -->
  <g filter="url(#cgMarkShadow)">
    <path
      d="M 64 8 C 88 8, 110 18, 116 28 C 116 70, 100 102, 64 122 C 28 102, 12 70, 12 28 C 18 18, 40 8, 64 8 Z"
      fill="url(#cgMarkShieldBg)"
      stroke="url(#cgMarkBorder)"
      stroke-width="4.5"
      stroke-linejoin="round"
    />
  </g>

  <!-- Inner Bevel Shield Face -->
  <path
    d="M 64 17 C 82 17, 100 25, 105 33 C 105 66, 92 92, 64 109 C 36 92, 23 66, 23 33 C 28 25, 46 17, 64 17 Z"
    fill="#081426"
    stroke="#1E3A8A"
    stroke-width="1.8"
    opacity="0.95"
  />

  <!-- High-Tech Circuit Traces -->
  <!-- Left Circuit Network -->
  <path
    d="M 32 46 L 46 46 L 54 56"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <circle cx="32" cy="46" r="3.2" fill="#38BDF8" />
  <circle cx="46" cy="46" r="2" fill="#93C5FD" />

  <!-- Right Circuit Network -->
  <path
    d="M 96 46 L 82 46 L 74 56"
    stroke="#38BDF8"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.85"
  />
  <circle cx="96" cy="46" r="3.2" fill="#38BDF8" />
  <circle cx="82" cy="46" r="2" fill="#93C5FD" />

  <!-- Lower Circuit Network -->
  <path
    d="M 42 90 L 52 90 L 58 84"
    stroke="#0284C7"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />
  <circle cx="42" cy="90" r="2.2" fill="#38BDF8" opacity="0.8" />

  <path
    d="M 86 90 L 76 90 L 70 84"
    stroke="#0284C7"
    stroke-width="1.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.6"
  />
  <circle cx="86" cy="90" r="2.2" fill="#38BDF8" opacity="0.8" />

  <!-- Center Top Security Keyline -->
  <line x1="64" y1="18" x2="64" y2="36" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

  <!-- Ghana Golden Core Medallion -->
  <circle
    cx="64"
    cy="66"
    r="28"
    fill="url(#cgMarkGold)"
    stroke="url(#cgMarkRing)"
    stroke-width="3"
    filter="url(#cgMarkGlow)"
  />

  <!-- High-Tech Inner Radar Ring -->
  <circle
    cx="64"
    cy="66"
    r="23.5"
    fill="none"
    stroke="#FEF08A"
    stroke-width="1.2"
    stroke-dasharray="4 3"
    opacity="0.8"
  />

  <!-- National Black Star (African Freedom Star) -->
  <!-- Center at (64, 66), Outer R=19, Inner R=7.6 -->
  <polygon
    points="
      64,47
      68.6,59.6
      82.0,60.0
      71.4,68.4
      75.2,81.4
      64,73.6
      52.8,81.4
      56.6,68.4
      46.0,60.0
      59.4,59.6
    "
    fill="#050811"
    stroke="#1E293B"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Core Golden Diamond Highlight -->
  <polygon
    points="64,63 66.5,66 64,69 61.5,66"
    fill="#FBBF24"
    opacity="0.95"
  />

  <!-- Green Defensive Terminal Point -->
  <circle cx="64" cy="102" r="3.2" fill="#10B981" />
</svg>
