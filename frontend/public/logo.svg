<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">
  <defs>
    <linearGradient id="cgFullShieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="45%" stop-color="#0B3E9E" />
      <stop offset="100%" stop-color="#051736" />
    </linearGradient>

    <linearGradient id="cgFullBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="cgFullGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cgGhanaText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="cgFullShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left: Shield Emblem (centered at x=40, y=40, scaled ~0.62) -->
  <g transform="translate(6, 6) scale(0.55)" filter="url(#cgFullShadow)">
    <!-- Outer Protective Shield Silhouette -->
    <path
      d="M 64 8 C 88 8, 110 18, 116 28 C 116 70, 100 102, 64 122 C 28 102, 12 70, 12 28 C 18 18, 40 8, 64 8 Z"
      fill="url(#cgFullShieldBg)"
      stroke="url(#cgFullBorder)"
      stroke-width="4"
      stroke-linejoin="round"
    />

    <!-- Inner Bevel Shield Face -->
    <path
      d="M 64 17 C 82 17, 100 25, 105 33 C 105 66, 92 92, 64 109 C 36 92, 23 66, 23 33 C 28 25, 46 17, 64 17 Z"
      fill="#081426"
      stroke="#1E3A8A"
      stroke-width="1.8"
      opacity="0.95"
    />

    <!-- Circuit Traces -->
    <path d="M 32 46 L 46 46 L 54 56" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <circle cx="32" cy="46" r="3.2" fill="#38BDF8" />

    <path d="M 96 46 L 82 46 L 74 56" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <circle cx="96" cy="46" r="3.2" fill="#38BDF8" />

    <line x1="64" y1="18" x2="64" y2="36" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />

    <!-- Ghana Gold Medallion -->
    <circle cx="64" cy="66" r="28" fill="url(#cgFullGold)" stroke="#FEF08A" stroke-width="2.5" />
    <circle cx="64" cy="66" r="23.5" fill="none" stroke="#FEF08A" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8" />

    <!-- Black Star -->
    <polygon
      points="
        64,47
        68.6,59.6
        82.0,60.0
        71.4,68.4
        75.2,81.4
        64,73.6
        52.8,81.4
        56.6,68.4
        46.0,60.0
        59.4,59.6
      "
      fill="#050811"
    />
    <circle cx="64" cy="66" r="2.2" fill="#FBBF24" />
    <circle cx="64" cy="102" r="3.2" fill="#10B981" />
  </g>

  <!-- Right: Modern Typography -->
  <g transform="translate(82, 0)">
    <!-- Main Brand Name -->
    <text x="0" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" letter-spacing="-0.5" fill="#0F172A">
      CyberGuard
    </text>
    <text x="156" y="38" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" letter-spacing="-0.5" fill="url(#cgGhanaText)">
      Ghana
    </text>

    <!-- National Flag Subtle Accent Bars -->
    <rect x="0" y="47" width="24" height="2" rx="1" fill="#EF4444" />
    <rect x="27" y="47" width="24" height="2" rx="1" fill="#F59E0B" />
    <rect x="54" y="47" width="24" height="2" rx="1" fill="#10B981" />

    <!-- Subtitle / Accreditation -->
    <text x="86" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" font-size="9" letter-spacing="1.5" fill="#64748B">
      NATIONAL COP ACADEMY · ACT 1038
    </text>

    <text x="0" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10.5" fill="#64748B">
      Accredited Youth Cyber Defense &amp; Child Safety
    </text>
  </g>
</svg>
