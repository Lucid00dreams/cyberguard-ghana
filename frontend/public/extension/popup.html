<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CyberGuard Master Extension Suite</title>
  <style>
    body {
      width: 340px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0B1528;
      color: #F8FAFC;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 900;
      font-size: 15px;
      color: #38BDF8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      background: #059669;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 9999px;
    }
    .section-title {
      font-size: 11px;
      font-family: monospace;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 10px 0 6px;
    }
    .list {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .ext-item {
      background: #111E36;
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }
    .ext-name {
      font-weight: 700;
      color: #FFFFFF;
    }
    .ext-status {
      color: #10B981;
      font-size: 11px;
      font-weight: 600;
    }
    .btn {
      background: #0056D2;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 800;
      font-size: 12px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: block;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #00419E;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <img src="logo-mark.svg" alt="CyberGuard Logo" style="width:22px;height:22px;vertical-align:middle;display:inline-block;" />
      <span>CyberGuard <span style="color:#FFFFFF;">Ghana</span></span>
    </div>
    <span class="badge">ACTIVE</span>
  </div>

  <div class="section-title">Installed Browser Engines</div>
  <div class="list" id="ext-list">
    <div class="ext-item">
      <span class="ext-name">Loading installed engines...</span>
    </div>
  </div>

  <a href="http://localhost:5173/extensions" target="_blank" class="btn">
    Open Extentions App Store
  </a>

  <script>
    chrome.storage.local.get(["installedExtensions", "extensionsData"], (data) => {
      const container = document.getElementById("ext-list");
      const list = data.installedExtensions || [];
      const extMap = data.extensionsData || {};

      if (list.length === 0) {
        container.innerHTML = '<div class="ext-item" style="color:#94a3b8;">No extensions active yet. Open the Extentions Store to install tools.</div>';
        return;
      }

      container.innerHTML = "";
      list.forEach((id) => {
        const item = document.createElement("div");
        item.className = "ext-item";
        const name = extMap[id]?.name || id;
        item.innerHTML = `
          <span class="ext-name">${name}</span>
          <span class="ext-status">● Running</span>
        `;
        container.appendChild(item);
      });
    });
  </script>
</body>
</html>
